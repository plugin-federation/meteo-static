name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      provider-model:
        description: "LiteLLM model string (e.g. xai/grok-build-0.1)"
        required: false
        default: "xai/grok-build-0.1"
      provider-api-key:
        description: "API key for the target provider"
        required: false
      provider-api-base:
        description: "Custom API base URL (for xai or OpenAI-compatible endpoints)"
        required: false
      transport:
        description: "MCP transport"
        required: false
        default: "stdio"
      mcp-command:
        description: "MCP server command"
        required: false
        default: "python"
      mcp-args:
        description: "MCP server arguments"
        required: false
        default: "src/server.py"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: pip install -r requirements.txt

      - name: Run evaluations
        uses: plugin-federation/plugin-federation-actions/actions/anthropic-mcp-eval@main
        with:
          evals-dir: ./evals
          transport: ${{ inputs.transport || 'stdio' }}
          mcp-command: ${{ inputs.mcp-command || 'python' }}
          mcp-args: ${{ inputs.mcp-args || 'src/server.py' }}
          provider-model: ${{ inputs.provider-model || 'xai/grok-build-0.1' }}
          provider-api-key: ${{ inputs.provider-api-key }}
          provider-api-base: ${{ inputs.provider-api-base }}
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_API_BASE: "https://api.x.ai/v1"

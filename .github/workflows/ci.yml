name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      provider-config:
        description: "Provider config (JSON)"
        required: false
        default: '{"provider": "anthropic"}'
      transport:
        description: "MCP transport"
        required: false
        default: "stdio"
      mcp-command:
        description: "MCP server command"
        required: false
        default: "python"
      mcp-args:
        description: "MCP server arguments"
        required: false
        default: "src/server.py"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: pip install -r requirements.txt

      - name: Run evaluations
        uses: plugin-federation/plugin-federation-actions/actions/anthropic-mcp-eval@main
        with:
          evals-dir: ./evals
          transport: ${{ inputs.transport || 'stdio' }}
          mcp-command: ${{ inputs.mcp-command || 'python' }}
          mcp-args: ${{ inputs.mcp-args || 'src/server.py' }}
          provider-config: ${{ inputs.provider-config || '{"provider": "anthropic"}' }}

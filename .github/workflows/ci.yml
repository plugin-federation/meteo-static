name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server dependencies
        run: pip install -r requirements.txt

      - name: Run evaluations
        uses: plugin-federation/plugin-federation-actions/actions/anthropic-mcp-eval@main
        with:
          evals-dir: ./evals
          transport: stdio
          mcp-command: python
          mcp-args: src/server.py
          provider-config: >
            {"provider": "anthropic"}
